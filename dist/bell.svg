<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Glow Pulse -->
  <circle cx="256" cy="256" r="160" fill="#F59E0B" opacity="0.12" filter="url(#glow)"/>
  
  <!-- Bell Group -->
  <g transform="translate(0, 0)">
    <!-- Bell Top Ring -->
    <circle cx="256" cy="148" r="28" fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Bell Body -->
    <path d="M160,320 C160,240 180,180 256,180 C332,180 352,240 352,320 C364,332 376,344 384,352 C388,356 384,364 376,364 L136,364 C128,364 124,356 128,352 C136,344 148,332 160,320 Z" fill="url(#gold)"/>
    
    <!-- Bell Lip Highlight -->
    <path d="M128,364 C128,376 136,384 148,384 L364,384 C376,384 384,376 384,364 Z" fill="#D97706"/>
    
    <!-- Clapper -->
    <ellipse cx="256" cy="392" rx="36" ry="24" fill="#B45309"/>
    <ellipse cx="256" cy="390" rx="32" ry="20" fill="url(#gold)"/>
    
    <!-- Sound Waves -->
    <path d="M96,210 C80,230 72,256 72,284" fill="none" stroke="#FDE047" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <path d="M416,210 C432,230 440,256 440,284" fill="none" stroke="#FDE047" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
